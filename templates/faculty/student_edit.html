{% extends "base.html" %}
{% block title %}Edit Student{% endblock %}
{% block page_title %}Edit Student Entry{% endblock %}
{% block page_subtitle %}{{ subject.code }} — {{ subject.name }}{% endblock %}

{% block content %}
<div class="card" style="max-width:480px;">
  <form method="POST">
    <label for="student_id">Student ID</label>
    <input type="text" id="student_id" value="{{ student.student_id }}" readonly>
    <label for="full_name">Full Name</label>
    <input type="text" id="full_name" name="full_name" value="{{ student.full_name }}" required>
    <label for="contact_number">Contact Number</label>
    <input type="text" id="contact_number" name="contact_number" value="{{ student.contact_number or '' }}">
    <button class="btn btn-primary" type="submit">Save Changes</button>
    <a class="btn btn-outline" href="{{ url_for('faculty.roster', offering_id=offering.id) }}">Cancel</a>
  </form>
</div>
{% endblock %}
